<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - DropDash</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/"><span class="logo"></span> <span id="brandName">DropDash</span></a>
      <nav class="nav-links">
        <a href="/#courses">Courses</a>
        <a href="/generator">Invite Videos</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:30px 20px">
    <h2>Checkout</h2>
    <div id="checkoutBody">
      <div id="step1" class="checkout-grid mt-16">
        <form id="buyerForm" class="form">
          <h3 style="margin-top:0">Your details</h3>
          <div>
            <label>Full name</label>
            <input name="buyer_name" required>
          </div>
          <div>
            <label>Email</label>
            <input type="email" name="buyer_email" required>
          </div>
          <div>
            <label>Phone (optional)</label>
            <input name="buyer_phone">
          </div>
          <button type="submit" class="btn btn-primary" id="payBtn">Pay &amp; get access</button>
          <p class="text-muted" style="font-size:12px;margin-top:10px">Secure payment by Razorpay — UPI, cards, netbanking &amp; wallets.</p>
          <div id="buyerAlert"></div>
        </form>
        <div class="card body" style="padding:22px">
          <h3 style="margin-top:0">Order summary</h3>
          <div id="orderSummary"></div>
        </div>
      </div>

      <div id="step3" class="hidden">
        <div class="alert success mt-16">
          <strong>Payment successful!</strong> Redirecting you to your order…
        </div>
      </div>
    </div>
  </main>

  <script src="/js/checkout-lib.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
