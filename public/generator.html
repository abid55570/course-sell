<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Video Maker</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .gen-hero { text-align:center; padding:40px 20px 10px; }
    .gen-hero h1 { font-size:34px; margin:0 0 8px; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:18px 0; }
    .chip { border:1px solid var(--border,#33374d); background:transparent; color:inherit; padding:7px 14px; border-radius:999px; cursor:pointer; font-size:14px; }
    .chip.active { background:#4f46e5; border-color:#4f46e5; color:#fff; }
    .tpl-thumb { aspect-ratio:9/16; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#fff; text-align:center; padding:16px; }
    .tpl-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; }
      @media (max-width: 600px) { .chip { padding: 10px 16px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/"><span class="logo"></span> <span id="brandName">DropDash</span></a>
      <nav class="nav-links">
        <a href="/#courses">Courses</a>
        <a href="/generator">Invite Videos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="gen-hero">
      <h1>Personalised Invite Videos</h1>
      <p class="text-muted">Weddings, festivals, birthdays &amp; more — customise, preview, and get your HD video on WhatsApp in minutes.</p>
      <div class="chips" id="catChips"></div>
    </section>
    <div id="tplGrid" class="tpl-grid" style="padding:10px 20px 60px"></div>
    <div id="tplEmpty" class="hidden" style="text-align:center;padding:40px"><p class="text-muted">No templates yet.</p></div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/generator.js"></script>
</body>
</html>
