<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Generator</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body{min-height:100vh}
    .ed-top{position:sticky;top:0;z-index:40;background:rgba(8,11,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft)}
    .ed-top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;flex-wrap:wrap}
    .ed-top .brand{font-size:17px}
    .ed-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .lic-pill{font-size:12.5px;color:var(--muted);padding:5px 10px;border:1px solid var(--border);border-radius:999px}
    .ed-main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:0;min-height:calc(100vh - 56px)}
    @media(max-width:900px){.ed-main{grid-template-columns:1fr}}
    .form-panel{overflow-y:auto;padding:18px;border-right:1px solid var(--border-soft)}
    .preview-wrap{overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px;gap:16px;background:radial-gradient(1000px 600px at 50% -10%,rgba(109,107,255,.10),transparent 60%)}
    #certPreview{box-shadow:var(--shadow);border-radius:6px;overflow:hidden}
    .preview-hint{color:var(--muted);font-size:13px;text-align:center}
    .fp-group{margin-bottom:18px}
    .fp-group h4{margin:0 0 9px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .ctl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .ctl-row label{font-size:13px;color:var(--muted)}
    .ctl-row select{padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;font-family:inherit}
    .ctl-row input[type=color]{width:36px;height:30px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px}
    .ctl-col{margin-bottom:10px}
    .ctl-col label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
    .ctl-col .hint{color:var(--primary-2);font-size:11px;text-transform:none;letter-spacing:0}
    .ctl-col input[type=text]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;font-family:inherit}
    .ctl-col input:focus,.ctl-row select:focus,.rec-panel textarea:focus{outline:none;border-color:var(--primary)}
    .photo-drop{border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px}
    .photo-drop img{max-height:64px;margin:0 auto;border-radius:6px}
    .add-fld{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;width:100%}
    .add-fld:hover{color:var(--text);border-color:var(--primary)}
    .rec-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:18px}
    .rec-panel h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .rec-panel .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
    .rec-panel textarea{width:100%;min-height:110px;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;font-family:inherit;resize:vertical}
    .csv-note{font-size:12px;color:var(--muted);margin-top:6px}
    .rec-count{display:inline-block;background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:10px}
    .cap-notice{margin-top:10px;font-size:12.5px;background:var(--gold-soft,rgba(230,193,90,.12));border:1px solid rgba(230,193,90,.35);color:var(--gold,#e6c15a);border-radius:8px;padding:9px 11px}
    .link-btn{background:none;border:none;color:var(--primary-2);text-decoration:underline;cursor:pointer;font-size:12.5px;font-family:inherit;padding:0}
    .or-div{text-align:center;color:var(--muted);font-size:11px;margin:10px 0}
    .gallery-overlay{position:fixed;inset:0;background:rgba(4,7,15,.9);backdrop-filter:blur(8px);z-index:60;display:none;flex-direction:column;padding:22px}
    .gallery-overlay.open{display:flex}
    .gal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px}
    .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;overflow-y:auto;padding-bottom:20px}
    .gal-card{border-radius:12px;border:1px solid var(--border);overflow:hidden;cursor:pointer;background:var(--surface);transition:transform .12s}
    .gal-card:hover{transform:translateY(-3px)}
    .gal-thumb{aspect-ratio:1414/1000;padding:14px;display:flex;align-items:stretch;justify-content:stretch}
    .gt-frame{flex:1;border:2px solid;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px;text-align:center}
    .gt-title{font-family:'Playfair Display',serif;font-weight:700;font-size:15px}
    .gt-rule{height:3px;width:56px;border-radius:2px}
    .gt-name{font-family:'Playfair Display',serif;font-weight:700;font-size:12px;margin-top:2px}
    .gt-frame .gr{height:5px;width:80%;border-radius:3px;margin-top:2px}
    .gal-body{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
    .gal-name{font-size:13.5px;font-weight:600}
    .badge-free{font-size:10px;font-weight:700;color:var(--success);border:1px solid var(--success);border-radius:6px;padding:1px 6px}
    .badge-pro{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:1px 6px}
  </style>
</head>
<body>
  <div class="ed-top">
    <div class="row">
      <a class="brand" href="/certificate"><span class="logo"></span> Certificate Generator</a>
      <div class="ed-actions">
        <span class="lic-pill" id="licenseStatus">Free preview</span>
        <button class="btn btn-sm" id="changeDesign">Change design</button>
        <button class="btn btn-sm" id="btnUnlock">Unlock (₹149)</button>
        <button class="btn btn-sm" id="exportZip">Download ZIP</button>
        <button class="btn btn-sm btn-primary" id="exportPdf">Download combined PDF</button>
      </div>
    </div>
  </div>

  <div class="ed-main">
    <div class="form-panel">
      <div class="rec-panel">
        <h4>Recipients</h4>
        <p class="sub">One name per line, or upload a CSV.</p>
        <textarea id="namesInput" placeholder="Priya Sharma&#10;Rahul Verma&#10;Anita Desai"></textarea>
        <div class="or-div">— or —</div>
        <div class="photo-drop" id="csvDrop">Upload CSV (needs a <b>name</b> column; optional <b>course</b>, <b>date</b>)</div>
        <input type="file" id="csvInput" accept=".csv,text/csv" style="display:none">
        <div class="csv-note" id="csvNote"></div>
        <div class="rec-count" id="recipCount">0 recipients</div>
        <div class="cap-notice" id="capNotice" style="display:none"></div>
      </div>
      <div id="formPanel"><!-- populated by JS --></div>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <div id="certPreview"></div>
      <div class="preview-hint">Live preview of the first recipient. Export renders every recipient.</div>
    </div>
  </div>

  <div class="gallery-overlay" id="galleryOverlay">
    <div class="gal-head">
      <h3 style="margin:0">Choose a certificate design</h3>
      <button class="btn btn-sm" id="galleryClose">Close</button>
    </div>
    <div class="chips" id="catChips"></div>
    <div class="gal-grid" id="galleryGrid"></div>
  </div>

  <script src="/js/checkout-lib.js"></script>
  <script src="/js/tool-kit.js"></script>
  <script src="/js/certificate-editor.js"></script>
</body>
</html>
