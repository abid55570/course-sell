<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Card Generator</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body{min-height:100vh}
    .ed-top{position:sticky;top:0;z-index:40;background:rgba(8,11,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft)}
    .ed-top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;flex-wrap:wrap}
    .ed-top .brand{font-size:17px}
    .ed-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .lic-pill{font-size:12.5px;color:var(--muted);padding:5px 10px;border:1px solid var(--border);border-radius:999px}
    .ed-main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:0;height:calc(100vh - 56px)}
    @media(max-width:880px){.ed-main{grid-template-columns:1fr;height:auto}}
    .form-panel{overflow-y:auto;padding:18px;border-right:1px solid var(--border-soft)}
    .preview-wrap{overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px;background:radial-gradient(1000px 600px at 50% -10%,rgba(30,91,214,.12),transparent 60%)}
    .fp-group{margin-bottom:20px}
    .fp-group h4{margin:0 0 9px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
    .count{background:var(--primary);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:700;letter-spacing:0}
    .ctl-col{margin-bottom:10px}
    .ctl-col label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
    .ctl-col input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;font-family:inherit}
    .ctl-col input:focus,.flabel:focus,.rcell:focus{outline:none;border-color:var(--primary)}
    .ctl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .ctl-row label{font-size:13px;color:var(--muted)}
    .ctl-row input[type=color]{width:34px;height:30px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px}
    .fldrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
    .fldrow .flabel{padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;font-family:inherit;width:100%}
    .fldrow .fkey{font-size:11px;color:var(--muted);font-family:monospace}
    .add-fld{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;width:100%;margin-top:2px}
    .add-fld:hover{color:var(--text);border-color:var(--primary)}
    .photo-drop{border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px}
    .photo-drop img{max-height:70px;margin:0 auto;border-radius:8px}
    .upload-box{border:1px dashed var(--border);border-radius:10px;padding:16px 12px;text-align:center;color:var(--muted);cursor:pointer;font-size:12.5px;line-height:1.4}
    .upload-box:hover{color:var(--text);border-color:var(--primary)}
    .hint{font-size:12px;color:var(--muted);padding:4px 0}
    .rrow{display:flex;align-items:center;gap:5px;margin-bottom:5px}
    .rrow .ridx{font-size:11px;color:var(--muted);width:16px;flex:0 0 auto;text-align:right}
    .rcell{flex:1;min-width:0;padding:6px 7px;border-radius:7px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:12px;font-family:inherit}
    .rrow .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px}
    .rrow .del:hover{color:var(--danger)}
    .card-shell{border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(2,6,23,.5)}
    .gallery-overlay{position:fixed;inset:0;background:rgba(4,7,15,.9);backdrop-filter:blur(8px);z-index:60;display:none;flex-direction:column;padding:22px}
    .gallery-overlay.open{display:flex}
    .gal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px}
    .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;overflow-y:auto;padding-bottom:20px}
    .gal-card{border-radius:12px;border:1px solid var(--border);overflow:hidden;cursor:pointer;background:var(--surface);transition:transform .12s}
    .gal-card:hover{transform:translateY(-3px)}
    .gal-thumb{height:230px;display:flex;flex-direction:column;align-items:center;gap:7px;padding-bottom:12px}
    .gal-thumb .gt-band{width:100%;padding:10px 12px;color:#fff;font-size:11px;font-weight:700;text-align:center;box-sizing:border-box}
    .gal-thumb .gt-band span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gal-thumb .gt-photo{width:70px;height:88px;border:2px solid;border-radius:8px;background:#ffffffaa;margin-top:6px}
    .gal-thumb .gt-name{font-weight:700;font-size:14px;font-family:'Space Grotesk',sans-serif}
    .gal-thumb .gr{height:5px;border-radius:3px;width:80%}
    .gal-body{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
    .gal-name{font-size:13.5px;font-weight:600}
    .badge-free{font-size:10px;font-weight:700;color:var(--success);border:1px solid var(--success);border-radius:6px;padding:1px 6px}
    .badge-pro{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:1px 6px}
      @media (max-width: 600px) { .del, .rrow .del { min-width: 40px; min-height: 40px; } }
  </style>
</head>
<body>
  <div class="ed-top">
    <div class="row">
      <a class="brand" href="/idcard"><span class="logo"></span> ID Card Generator</a>
      <div class="ed-actions">
        <span class="lic-pill" id="licenseStatus">Free preview</span>
        <button class="btn btn-sm" id="btnUnlock">Unlock (₹149)</button>
        <button class="btn btn-sm" id="exportPng">Download single card (PNG)</button>
        <button class="btn btn-sm btn-primary" id="exportPdf">Download print sheet (A4 PDF)</button>
      </div>
    </div>
  </div>

  <div class="ed-main">
    <div class="form-panel" id="formPanel"><!-- populated by JS --></div>
    <div class="preview-wrap" id="previewWrap">
      <div class="card-shell" id="cardPreview"></div>
    </div>
  </div>

  <div class="gallery-overlay" id="galleryOverlay">
    <div class="gal-head">
      <h3 style="margin:0">Choose an ID card template</h3>
      <button class="btn btn-sm" id="galleryClose">Close</button>
    </div>
    <div class="chips" id="catChips"></div>
    <div class="gal-grid" id="galleryGrid"></div>
  </div>

  <script src="/js/checkout-lib.js"></script>
  <script src="/js/tool-kit.js"></script>
  <script src="/js/idcard-editor.js"></script>
</body>
</html>
