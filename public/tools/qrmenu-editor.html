<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Menu Editor</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Cinzel:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body{min-height:100vh}
    .ed-top{position:sticky;top:0;z-index:40;background:rgba(8,11,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft)}
    .ed-top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;flex-wrap:wrap}
    .ed-top .brand{font-size:17px}
    .ed-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .lic-pill{font-size:12.5px;color:var(--muted);padding:5px 10px;border:1px solid var(--border);border-radius:999px}
    .ed-main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:0;height:calc(100vh - 58px)}
    @media(max-width:900px){.ed-main{grid-template-columns:1fr;height:auto}}
    .form-panel{overflow-y:auto;padding:18px;border-right:1px solid var(--border-soft)}
    .preview-wrap{overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 18px;background:radial-gradient(1000px 600px at 50% -10%,rgba(109,107,255,.10),transparent 60%)}

    /* form controls */
    .fp-group{margin-bottom:18px}
    .fp-group h4{margin:0 0 9px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .cat-block{border:1px solid var(--border-soft);border-radius:12px;padding:12px;background:rgba(255,255,255,.015)}
    .ctl-col{margin-bottom:10px}
    .ctl-col label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
    .ctl-col input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:14px;font-family:inherit}
    .ctl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .ctl-row label{font-size:13px;color:var(--muted)}
    .ctl-row select,.ctl-row input[type=text]{padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;font-family:inherit}
    .ctl-row input[type=color]{width:38px;height:30px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px;cursor:pointer}
    input:focus,select:focus{outline:none;border-color:var(--primary)}
    .swatches{display:flex;flex-wrap:wrap;gap:8px}
    .sw{width:34px;height:34px;border-radius:9px;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
    .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .sec-head input{flex:1;font-weight:600;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:14px;font-family:inherit}
    .item-row{border-top:1px dashed var(--border-soft);padding:9px 0}
    .item-line1{display:grid;grid-template-columns:1fr 78px auto;gap:6px;align-items:center;margin-bottom:6px}
    .item-line2{display:flex;gap:8px;align-items:center}
    .item-line2 .idesc{flex:1}
    .item-row input[type=text]{padding:8px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;font-family:inherit;width:100%}
    .veg-toggle{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
    .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px}
    .del:hover{color:var(--danger)}
    .add-fld{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:8px 10px;font-size:12.5px;cursor:pointer;width:100%;margin-top:8px}
    .add-fld:hover{color:var(--text);border-color:var(--primary)}

    /* phone-frame preview */
    .phone{width:340px;max-width:100%;background:#0b0e18;border:10px solid #05070d;border-radius:38px;box-shadow:0 24px 60px rgba(2,6,23,.6);overflow:hidden}
    .phone .notch{height:26px;background:#05070d;display:flex;align-items:center;justify-content:center}
    .phone .notch::after{content:'';width:80px;height:6px;border-radius:6px;background:#1c2740}
    .menu-screen{height:600px;overflow-y:auto;padding:22px 18px 40px;font-family:'Inter',sans-serif}
    .menu-screen::-webkit-scrollbar{width:6px}
    .menu-screen::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:3px}
    .mv-head{text-align:center;margin-bottom:20px}
    .mv-shop{font-size:26px;font-weight:700;line-height:1.15}
    .mv-tag{font-size:13px;opacity:.8;margin-top:6px;font-style:italic}
    .mv-cat{margin-bottom:20px}
    .mv-cat-name{font-size:18px;font-weight:700;padding-bottom:6px;margin-bottom:10px;border-bottom:2px solid;letter-spacing:.02em}
    .mv-item{display:flex;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:7px}
    .mv-dot{flex:none;width:14px;height:14px;border:2px solid;border-radius:3px;display:flex;align-items:center;justify-content:center;margin-top:3px}
    .mv-dot i{width:6px;height:6px;border-radius:50%;display:block}
    .mv-item-main{flex:1;min-width:0}
    .mv-item-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    .mv-item-name{font-weight:600;font-size:14.5px}
    .mv-item-price{font-weight:700;font-size:14px;white-space:nowrap}
    .mv-item-desc{font-size:12px;opacity:.75;margin-top:2px;line-height:1.35}
    .mv-empty{font-size:12.5px;opacity:.6;text-align:center;padding:8px}
    .preview-hint{color:var(--muted);font-size:12.5px;margin-top:14px;text-align:center}

    /* publish */
    .publish-bar{width:340px;max-width:100%;margin-top:18px}
    .publish-bar .btn{width:100%}
    .pub-alert{display:none;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
    .pub-alert.show{display:block}
    .pub-alert.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fecaca}
    .publish-success{display:none;width:340px;max-width:100%;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center}
    .publish-success.open{display:block}
    .ps-check{font-weight:700;color:var(--success);font-size:16px;margin-bottom:12px}
    .ps-qr{width:200px;height:200px;background:#fff;border-radius:12px;padding:8px;display:block;margin:0 auto 14px}
    .ps-url-row{display:flex;gap:6px;margin-bottom:10px}
    .ps-url-row input{flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:12.5px;font-family:monospace}
    .ps-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .ps-note{color:var(--muted);font-size:12px;margin:14px 0 0;line-height:1.45}

    /* gallery overlay */
    .gallery-overlay{position:fixed;inset:0;background:rgba(4,7,15,.9);backdrop-filter:blur(8px);z-index:60;display:none;flex-direction:column;padding:22px}
    .gallery-overlay.open{display:flex}
    .gal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px}
    .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;overflow-y:auto;padding-bottom:20px}
    .gal-card{border-radius:12px;border:1px solid var(--border);overflow:hidden;cursor:pointer;background:var(--surface);transition:transform .12s}
    .gal-card:hover{transform:translateY(-3px)}
    .gal-thumb{height:180px;padding:16px;display:flex;flex-direction:column;gap:7px}
    .gal-thumb .gt{text-align:center;font-weight:700;font-size:16px;font-family:'Poppins',sans-serif;margin-bottom:4px}
    .gal-thumb .gr{height:6px;border-radius:3px;background:rgba(0,0,0,.12)}
    .gal-body{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
    .gal-name{font-size:13.5px;font-weight:600}
    .badge-free{font-size:10px;font-weight:700;color:var(--success);border:1px solid var(--success);border-radius:6px;padding:1px 6px}
  </style>
</head>
<body>
  <div class="ed-top">
    <div class="row">
      <a class="brand" href="/qrmenu"><span class="logo"></span> QR Menu Maker</a>
      <div class="ed-actions">
        <span class="lic-pill" id="licenseStatus">Free preview</span>
        <button class="btn btn-sm" id="changeDesign">Change theme</button>
        <button class="btn btn-sm" id="btnUnlock">Unlock (₹699)</button>
        <button class="btn btn-sm btn-primary" id="btnPublish">Publish live QR menu →</button>
      </div>
    </div>
  </div>

  <div class="ed-main">
    <div class="form-panel" id="formPanel"><!-- populated by JS --></div>
    <div class="preview-wrap" id="previewWrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="menu-screen" id="menuScreen"></div>
      </div>
      <div class="preview-hint">This is what your customers see when they scan the QR.</div>
      <div class="publish-bar">
        <div class="pub-alert" id="pubAlert"></div>
      </div>
      <div class="publish-success" id="publishSuccess"></div>
    </div>
  </div>

  <div class="gallery-overlay" id="galleryOverlay">
    <div class="gal-head">
      <h3 style="margin:0">Choose a menu theme</h3>
      <button class="btn btn-sm" id="galleryClose">Close</button>
    </div>
    <div class="chips" id="catChips"></div>
    <div class="gal-grid" id="galleryGrid"></div>
  </div>

  <script src="/js/checkout-lib.js"></script>
  <script src="/js/tool-kit.js"></script>
  <script src="/js/qrmenu-editor.js"></script>
</body>
</html>
