<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rent Receipt Editor</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body{min-height:100vh}
    .ed-top{position:sticky;top:0;z-index:40;background:rgba(8,11,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft)}
    .ed-top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;flex-wrap:wrap}
    .ed-top .brand{font-size:17px}
    .ed-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .lic-pill{font-size:12.5px;color:var(--muted);padding:5px 10px;border:1px solid var(--border);border-radius:999px}
    .ed-main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:0;height:calc(100vh - 56px)}
    @media(max-width:880px){.ed-main{grid-template-columns:1fr;height:auto}}
    .form-panel{overflow-y:auto;padding:18px;border-right:1px solid var(--border-soft)}
    .preview-wrap{overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;background:radial-gradient(1000px 600px at 50% -10%,rgba(109,107,255,.10),transparent 60%)}
    .preview-meta{color:var(--muted);font-size:12.5px;margin-bottom:14px;text-align:center}
    #receiptPreview{width:100%;max-width:660px}
    .fp-group{margin-bottom:20px}
    .fp-group h4{margin:0 0 11px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .fld-lbl{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px}
    .fld-lbl .opt{color:var(--muted);opacity:.7;font-weight:400}
    .fp-input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13.5px;font-family:inherit;box-sizing:border-box}
    .fp-input:focus{outline:none;border-color:var(--primary)}
    textarea.fp-input{resize:vertical}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .gallery-overlay{position:fixed;inset:0;background:rgba(4,7,15,.9);backdrop-filter:blur(8px);z-index:60;display:none;flex-direction:column;padding:22px}
    .gallery-overlay.open{display:flex}
    .gal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;overflow-y:auto;padding-bottom:20px}
    .gal-card{border-radius:12px;border:1px solid var(--border);overflow:hidden;cursor:pointer;background:var(--surface);transition:transform .12s}
    .gal-card:hover{transform:translateY(-3px)}
    .gal-card.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
    .gal-thumb{height:170px;padding:16px;display:flex;flex-direction:column;gap:6px;background:#ffffff;margin:10px;border-radius:8px}
    .gal-thumb .gt{text-align:center;font-weight:700;font-size:13px;letter-spacing:.12em}
    .gal-thumb .grule{height:2px;border-radius:2px;margin:2px 0 6px}
    .gal-thumb .gr{height:6px;border-radius:3px;background:#dfe3ea}
    .gal-thumb .gsign{height:6px;width:45%;border-radius:3px;background:#c8cdd6;margin-top:auto;align-self:flex-end}
    .gal-body{padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
    .gal-name{font-size:13.5px;font-weight:600}
    .badge-free{font-size:10px;font-weight:700;color:var(--success);border:1px solid var(--success);border-radius:6px;padding:1px 6px}
    .badge-pro{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:1px 6px}
  </style>
</head>
<body>
  <div class="ed-top">
    <div class="row">
      <a class="brand" href="/rentreceipt"><span class="logo"></span> 🏠 Rent Receipts</a>
      <div class="ed-actions">
        <span class="lic-pill" id="licenseStatus">Free preview</span>
        <button class="btn btn-sm" id="changeStyle">Change style</button>
        <button class="btn btn-sm" id="btnUnlock">Unlock (₹99)</button>
        <button class="btn btn-sm btn-primary" id="exportReceipts">Download 12 receipts (PDF)</button>
        <button class="btn btn-sm" id="exportAgreement">Download Rent Agreement (PDF)</button>
      </div>
    </div>
  </div>

  <div class="ed-main">
    <div class="form-panel" id="formPanel"><!-- populated by JS --></div>
    <div class="preview-wrap" id="previewWrap">
      <div class="preview-meta" id="previewMeta"></div>
      <div id="receiptPreview"></div>
    </div>
  </div>

  <div class="gallery-overlay" id="galleryOverlay">
    <div class="gal-head">
      <h3 style="margin:0">Choose a receipt style</h3>
      <button class="btn btn-sm" id="galleryClose">Close</button>
    </div>
    <div class="gal-grid" id="galleryGrid"></div>
  </div>

  <script src="/js/checkout-lib.js"></script>
  <script src="/js/tool-kit.js"></script>
  <script src="/js/rentreceipt-editor.js"></script>
</body>
</html>
